[package]
name = "buildsmith"
version = "0.1.0"
edition = "2024"
description = "A content-hashed, DAG-based build system"
license = "MIT"
repository = "https://github.com/ze/buildsmith"
homepage = "https://github.com/ze/buildsmith"
readme = "README.md"
keywords = ["build", "task-runner", "cache", "dag", "incremental"]
categories = ["development-tools::build-utils"]

[[bin]]
name = "buildsmith"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
colored = "2"
anyhow = "1"
petgraph = "0.6"
notify = "7"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
