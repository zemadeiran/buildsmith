[package]
name = "forge"
version = "0.1.0"
edition = "2024"
description = "A content-hashed, DAG-based build system"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
colored = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"
rayon = "1"
petgraph = "0.6"
notify = "7"
serde_json = "1"
